name: Publish GHCR

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a
      - uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=raw,value={{tag lstrip=v}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version-file: go.mod
          cache: true
      - name: Complete verification before image build
        run: |
          set -eu
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go build -trimpath ./cmd/backlog-bot
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.12.2
      - name: Go vulnerability scan
        uses: golang/govulncheck-action@b625fbe08f3bccbe446d94fbf87fcc875a4f50ee
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify stable semantic release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
      - name: Build architecture images and smoke-test runner architecture
        run: |
          set -eu
          host_arch="$(docker version --format '{{.Server.Arch}}')"
          case "$host_arch" in
            amd64|x86_64) host_arch=amd64 ;;
            arm64|aarch64) host_arch=arm64 ;;
            *) echo "unsupported runner architecture: $host_arch" >&2; exit 1 ;;
          esac
          docker build --platform "linux/$host_arch" --tag "backlog-bot:$host_arch" .
          other_arch=amd64
          [ "$host_arch" = amd64 ] && other_arch=arm64
          docker build --platform "linux/$other_arch" --tag "backlog-bot:$other_arch" .
          mkdir -p /tmp/backlog-healthcheck
          chmod 777 /tmp/backlog-healthcheck
          touch /tmp/backlog-healthcheck/backlog.db
          chmod 666 /tmp/backlog-healthcheck/backlog.db
          now=$(date -u +%FT%T.%NZ)
          printf '{"started_at":"%s","last_success_at":"%s"}' "$now" "$now" > /tmp/backlog-healthcheck/.heartbeat
          docker run --rm --user 10001:10001 -e HEARTBEAT_PATH=/data/.heartbeat -e DATABASE_PATH=/data/backlog.db -v /tmp/backlog-healthcheck:/data "backlog-bot:$host_arch" healthcheck
      - name: Scan architecture builds before publish
        run: |
          set -eu
          image='aquasec/trivy@sha256:5c59e08f980b5d4d503329773480fcea2c9bdad7e381d846fbf9f2ecb8050f6b'
          docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock "$image" image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 backlog-bot:amd64
          docker run --rm --network host -v /var/run/docker.sock:/var/run/docker.sock "$image" image --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 backlog-bot:arm64
      - name: Verify release aliases are immutable
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -eu
          for tag in "${GITHUB_REF_NAME#v}" "${GITHUB_REF_NAME}"; do
            if docker buildx imagetools inspect "$IMAGE:$tag" >/dev/null 2>&1; then
              echo "release alias already exists: $tag" >&2
              exit 1
            fi
          done
      - name: Build and publish
        id: push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Attest provenance
        uses: actions/attest-build-provenance@210c1913531870065f03ce1f9440dd87bc0938cd
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Verify aliases and summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -eu
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            resolved=$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' | tr -d '\r\n')
            case "$resolved" in sha256:*) ;; *) echo "invalid digest for $tag: $resolved"; exit 1 ;; esac
            test "$resolved" = "$DIGEST" || { echo "alias does not resolve to published digest: $tag"; exit 1; }
          done <<< '${{ steps.meta.outputs.tags }}'
      - name: Summary
        run: |
          {
            echo '### Published image'
            echo
            echo '- digest: `${{ steps.push.outputs.digest }}`'
            echo '- tags:'
            echo '${{ steps.meta.outputs.tags }}' | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    permissions: {}
    env:
      DEPLOY_TAG: sha-${{ github.sha }}@${{ needs.publish.outputs.image_digest }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_DEPLOY_USER: ${{ secrets.VPS_DEPLOY_USER }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
    steps:
      - name: Deploy published image
        shell: bash
        run: |
          set -euo pipefail
          case "$VPS_PORT" in
            ''|*[!0-9]*) echo 'VPS_PORT must be numeric' >&2; exit 1 ;;
          esac
          if [[ ! "$DEPLOY_TAG" =~ ^sha-[0-9a-f]{40}@sha256:[0-9a-f]{64}$ ]]; then
            echo 'invalid published image reference' >&2
            exit 1
          fi


          key=$(mktemp)
          known_hosts=$(mktemp)
          cleanup() { rm -f "$key" "$known_hosts"; }
          trap cleanup EXIT
          printf '%s\n' "$VPS_DEPLOY_KEY" > "$key"
          printf '%s\n' "$VPS_HOST_KEY" > "$known_hosts"
          chmod 600 "$key" "$known_hosts"
          ssh-keygen -F "[$VPS_HOST]:$VPS_PORT" -f "$known_hosts" >/dev/null

          if ! deploy_output=$(base64 -w0 <<'REMOTE' | ssh \
            -i "$key" \
            -p "$VPS_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts" \
            "$VPS_DEPLOY_USER@$VPS_HOST" \
            "base64 -d | DEPLOY_TAG='$DEPLOY_TAG' bash -s"
          set -euo pipefail
          stage() { printf 'DEPLOY_STAGE=%s\n' "$1" >&2; }
          stage preflight
          app=/opt/telegram-backlog-bot
          cd "$app"
          test -f docker-compose.yml
          test -f .env
          test -d backups
          compose=(docker compose --env-file .env)

          valid_image_ref() {
            [[ "$1" =~ ^sha-[0-9a-f]{40}(@sha256:[0-9a-f]{64})?$ ]]
          }
          write_tag() {
            local tag=$1 tmp
            tmp=$(mktemp .env.XXXXXX)
            chmod --reference=.env "$tmp"
            awk -v tag="$tag" '
              /^IMAGE_TAG=/ { print "IMAGE_TAG=" tag; found=1; next }
              { print }
              END { exit !found }
            ' .env > "$tmp"
            mv "$tmp" .env
          }
          wait_healthy() {
            local container status
            container=$("${compose[@]}" ps -q bot)
            test -n "$container"
            for _ in $(seq 1 18); do
              status=$(docker inspect --format '{{.State.Health.Status}}' "$container")
              [ "$status" = healthy ] && return 0
              [ "$status" = unhealthy ] && return 1
              sleep 10
            done
            return 1
          }

          previous_tag=$(sed -n 's/^IMAGE_TAG=//p' .env)
          valid_image_ref "$previous_tag"
          valid_image_ref "$DEPLOY_TAG"
          if [ "$previous_tag" = "$DEPLOY_TAG" ]; then
            printf 'DEPLOY_OK\n'
            exit 0
          fi
          "${compose[@]}" config --quiet
          stage backup
          "${compose[@]}" exec -T bot /backlog-bot backup --output /backups </dev/null >/dev/null

          rollback_needed=1
          rollback() {
            local status=$?
            trap - EXIT
            if [ "$rollback_needed" = 1 ]; then
              echo 'Deployment failed; restoring the previous image.' >&2
              if write_tag "$previous_tag" && "${compose[@]}" pull && "${compose[@]}" up -d --force-recreate && wait_healthy; then
                echo 'Rollback completed.' >&2
              else
                echo 'Rollback failed; manual intervention is required.' >&2
              fi
            fi
            exit "$status"
          }
          trap rollback EXIT

          stage pull
          write_tag "$DEPLOY_TAG"
          "${compose[@]}" pull
          stage recreate
          "${compose[@]}" up -d --force-recreate
          stage health
          wait_healthy
          stage logs
          container=$("${compose[@]}" ps -q bot)
          logs=$(mktemp)
          if ! docker logs "$container" > "$logs" 2>&1; then
            rm -f "$logs"
            echo 'Unable to read new container logs.' >&2
            exit 1
          fi
          if grep -Eiq '"level":"ERROR"|panic|fatal|readonly database|heartbeat stopped|runtime loop stopped|database startup failed|telegram startup failed|authorized chat binding failed' "$logs"; then
            rm -f "$logs"
            echo 'New container emitted an error log.' >&2
            exit 1
          fi
          rm -f "$logs"
          rollback_needed=0
          trap - EXIT
          printf 'DEPLOY_OK\n'
          REMOTE
          ); then
            printf '%s\n' "$deploy_output" >&2
            exit 1
          fi
          printf '%s\n' "$deploy_output"
          grep -qx 'DEPLOY_OK' <<< "$deploy_output"
